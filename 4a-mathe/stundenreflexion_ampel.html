<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stundenreflexion – Klasse 4a</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap');

    :root {
      --green: #3dba5a;
      --green-glow: #5eff82;
      --yellow: #f5c400;
      --yellow-glow: #ffe455;
      --red: #e8392a;
      --red-glow: #ff6b5b;
      --bg: #1a1f2e;
      --panel: #252b3b;
      --border: #333d56;
      --text: #e8eaf6;
      --muted: #7b85a3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      user-select: none;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: 0.02em;
      line-height: 1.15;
      color: #fff;
      text-shadow: 0 2px 18px rgba(255,255,255,0.12);
    }
    header p {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 6px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Zähler-Leiste ── */
    .counter-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .counter-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 1.1rem;
      font-weight: 900;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .counter-chip.green  { border-color: var(--green);  }
    .counter-chip.yellow { border-color: var(--yellow); }
    .counter-chip.red    { border-color: var(--red);    }

    .dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green  { background: var(--green);  box-shadow: 0 0 8px var(--green-glow); }
    .dot.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow-glow); }
    .dot.red    { background: var(--red);    box-shadow: 0 0 8px var(--red-glow); }

    .chip-label { color: var(--muted); font-weight: 700; font-size: 0.85rem; }
    .chip-count { font-size: 1.5rem; color: #fff; min-width: 32px; text-align: center; }

    /* ── Ampel-Gehäuse ── */
    .traffic-light {
      background: linear-gradient(160deg, #2c3347 0%, #1e2535 100%);
      border: 3px solid #3a4260;
      border-radius: 56px;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      box-shadow:
        0 0 0 6px #141824,
        0 20px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative;
    }

    /* Schraube-Deko oben/unten */
    .traffic-light::before,
    .traffic-light::after {
      content: '';
      width: 14px; height: 14px;
      background: #1a1f2e;
      border: 2px solid #3a4260;
      border-radius: 50%;
      position: absolute;
      left: 50%; transform: translateX(-50%);
    }
    .traffic-light::before { top: 10px; }
    .traffic-light::after  { bottom: 10px; }

    /* ── Einzelne Lampe ── */
    .lamp {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: transform 0.12s ease, box-shadow 0.18s ease;
      outline: none;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* off-state */
    .lamp.green  { background: radial-gradient(circle at 38% 35%, #2a7a42, #0e3a1e); box-shadow: inset 0 3px 12px rgba(0,0,0,0.5); }
    .lamp.yellow { background: radial-gradient(circle at 38% 35%, #a08a00, #4a3e00); box-shadow: inset 0 3px 12px rgba(0,0,0,0.5); }
    .lamp.red    { background: radial-gradient(circle at 38% 35%, #8a1e14, #3e0e0a); box-shadow: inset 0 3px 12px rgba(0,0,0,0.5); }

    /* on-state (class "lit") */
    .lamp.green.lit {
      background: radial-gradient(circle at 38% 35%, #7fff9a, var(--green));
      box-shadow:
        0 0 30px 8px rgba(61,186,90,0.55),
        0 0 70px 20px rgba(61,186,90,0.25),
        inset 0 3px 12px rgba(255,255,255,0.25);
    }
    .lamp.yellow.lit {
      background: radial-gradient(circle at 38% 35%, #fff59a, var(--yellow));
      box-shadow:
        0 0 30px 8px rgba(245,196,0,0.55),
        0 0 70px 20px rgba(245,196,0,0.25),
        inset 0 3px 12px rgba(255,255,255,0.25);
    }
    .lamp.red.lit {
      background: radial-gradient(circle at 38% 35%, #ff9a9a, var(--red));
      box-shadow:
        0 0 30px 8px rgba(232,57,42,0.55),
        0 0 70px 20px rgba(232,57,42,0.25),
        inset 0 3px 12px rgba(255,255,255,0.25);
    }

    /* Glanzfleck */
    .lamp::after {
      content: '';
      position: absolute;
      top: 18%; left: 22%;
      width: 30%; height: 20%;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      filter: blur(4px);
      pointer-events: none;
    }

    .lamp:hover  { transform: scale(1.06); }
    .lamp:active { transform: scale(0.96); }

    /* ── Label unter Ampel ── */
    .labels {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 32px;
      width: 100%;
      max-width: 360px;
    }
    .label-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--panel);
      border-radius: 12px;
      padding: 10px 18px;
      border-left: 5px solid transparent;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .label-row.green  { border-color: var(--green); }
    .label-row.yellow { border-color: var(--yellow); }
    .label-row.red    { border-color: var(--red); }

    /* ── Reset-Button ── */
    .reset-btn {
      margin-top: 36px;
      background: transparent;
      border: 2px solid var(--border);
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 28px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
    }
    .reset-btn:hover { border-color: var(--text); color: var(--text); }

    /* ── Animierter Pulse beim Klick ── */
    @keyframes pulse-ring {
      0%   { transform: scale(1);    opacity: 0.8; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid currentColor;
      animation: pulse-ring 0.5s ease-out forwards;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Stundenreflexion</h1>
    <p>Klasse 4a · Grundschule Böhlitz-Ehrenberg</p>
  </header>

  <!-- Zähler -->
  <div class="counter-bar">
    <div class="counter-chip green">
      <span class="dot green"></span>
      <span class="chip-label">Gut verstanden</span>
      <span class="chip-count" id="cnt-green">0</span>
    </div>
    <div class="counter-chip yellow">
      <span class="dot yellow"></span>
      <span class="chip-label">Unsicher</span>
      <span class="chip-count" id="cnt-yellow">0</span>
    </div>
    <div class="counter-chip red">
      <span class="dot red"></span>
      <span class="chip-label">Brauche Hilfe</span>
      <span class="chip-count" id="cnt-red">0</span>
    </div>
  </div>

  <!-- Ampel -->
  <div class="traffic-light" aria-label="Ampel-Reflexion">
    <button class="lamp red"    id="lamp-red"    aria-label="Rot – brauche Hilfe"    onclick="click_lamp('red')"></button>
    <button class="lamp yellow" id="lamp-yellow" aria-label="Gelb – unsicher"         onclick="click_lamp('yellow')"></button>
    <button class="lamp green"  id="lamp-green"  aria-label="Grün – gut verstanden"   onclick="click_lamp('green')"></button>
  </div>

  <!-- Legende -->
  <div class="labels">
    <div class="label-row green">
      <span class="dot green"></span>
      🟢 Ich habe alles gut verstanden.
    </div>
    <div class="label-row yellow">
      <span class="dot yellow"></span>
      🟡 Ich bin mir noch unsicher.
    </div>
    <div class="label-row red">
      <span class="dot red"></span>
      🔴 Ich brauche noch Hilfe.
    </div>
  </div>

  <button class="reset-btn" onclick="reset_all()">↺ Zurücksetzen</button>

  <script>
    const counts = { green: 0, yellow: 0, red: 0 };
    let activeTimeout = null;

    function click_lamp(color) {
      counts[color]++;
      document.getElementById('cnt-' + color).textContent = counts[color];

      // Alle Lampen aus
      ['green','yellow','red'].forEach(c => {
        document.getElementById('lamp-' + c).classList.remove('lit');
      });

      // Angeklickte Lampe an
      const lamp = document.getElementById('lamp-' + color);
      lamp.classList.add('lit');

      // Pulse-Ring erzeugen
      const ring = document.createElement('span');
      ring.className = 'pulse-ring';
      ring.style.color = getComputedStyle(document.documentElement)
        .getPropertyValue('--' + color).trim();
      lamp.appendChild(ring);
      ring.addEventListener('animationend', () => ring.remove());

      // Nach 1,2 s Lampe wieder dimmen (Ampel wartet auf nächstes Kind)
      if (activeTimeout) clearTimeout(activeTimeout);
      activeTimeout = setTimeout(() => {
        lamp.classList.remove('lit');
      }, 1200);
    }

    function reset_all() {
      counts.green = 0; counts.yellow = 0; counts.red = 0;
      ['green','yellow','red'].forEach(c => {
        document.getElementById('cnt-' + c).textContent = '0';
        document.getElementById('lamp-' + c).classList.remove('lit');
      });
    }
  </script>
</body>
</html>
