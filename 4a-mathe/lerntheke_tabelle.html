<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lerntheke – Klasse 4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --s1: #FF6B6B;
    --s2: #FF9F43;
    --s3: #1DD1A1;
    --s4: #54A0FF;
    --s5: #A29BFE;
    --dark: #2D3436;
    --bg: #F0F4F8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: white;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    z-index: 10;
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem;
    color: var(--dark);
  }
  header h1 span { color: #FF6B6B; }

  #reset-btn {
    background: #dfe6e9;
    border: none;
    border-radius: 12px;
    padding: 8px 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: .9rem;
    color: #636e72;
    cursor: pointer;
    transition: background .2s;
  }
  #reset-btn:hover { background: #b2bec3; color: white; }

  /* ── TABLE WRAPPER ── */
  .table-wrap {
    flex: 1;
    overflow: auto;
    padding: 20px 24px;
  }

  /* ── TABLE ── */
  table {
    border-collapse: collapse;
    width: 100%;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
  }

  /* Header row */
  thead th {
    padding: 14px 10px;
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    color: white;
    border-right: 2px solid rgba(255,255,255,.3);
  }
  thead th:last-child { border-right: none; }

  th.name-col {
    background: var(--dark);
    font-size: 1rem;
    min-width: 110px;
    text-align: left;
    padding-left: 16px;
  }
  th.s1 { background: var(--s1); }
  th.s2 { background: var(--s2); }
  th.s3 { background: var(--s3); }
  th.s4 { background: var(--s4); }
  th.s5 { background: var(--s5); }

  /* Body rows */
  tbody tr {
    border-bottom: 1px solid #eee;
    transition: background .15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f8f9fa; }

  tbody td {
    padding: 0;
    text-align: center;
    border-right: 1px solid #eee;
    height: 46px;
  }
  tbody td:last-child { border-right: none; }

  td.name-cell {
    text-align: left;
    padding: 0 16px;
    font-weight: 800;
    font-size: .95rem;
    color: var(--dark);
    white-space: nowrap;
    border-right: 2px solid #ddd;
  }
  td.name-cell.all-done {
    color: #1DD1A1;
  }
  td.name-cell.all-done::before {
    content: '🌟 ';
  }

  /* Check cell */
  .check-cell {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s;
    min-width: 90px;
  }
  .check-cell:hover { filter: brightness(.94); }

  .check-cell.done-s1 { background: #FFE8E8; }
  .check-cell.done-s2 { background: #FFF3E0; }
  .check-cell.done-s3 { background: #E0FBF4; }
  .check-cell.done-s4 { background: #E0EFFF; }
  .check-cell.done-s5 { background: #EEEAFF; }

  .check-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2.5px solid #ddd;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .85rem;
    color: #ccc;
    font-weight: 800;
    transition: all .2s;
    user-select: none;
  }

  .check-cell.done-s1 .check-icon { background: var(--s1); border-color: var(--s1); color: white; font-size: 1.1rem; }
  .check-cell.done-s2 .check-icon { background: var(--s2); border-color: var(--s2); color: white; font-size: 1.1rem; }
  .check-cell.done-s3 .check-icon { background: var(--s3); border-color: var(--s3); color: white; font-size: 1.1rem; }
  .check-cell.done-s4 .check-icon { background: var(--s4); border-color: var(--s4); color: white; font-size: 1.1rem; }
  .check-cell.done-s5 .check-icon { background: var(--s5); border-color: var(--s5); color: white; font-size: 1.1rem; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--dark); color: white;
    padding: 12px 28px; border-radius: 30px;
    font-weight: 700; font-size: 1rem;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
    z-index: 200;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🏫 Lern<span>theke</span> – Klasse 4</h1>
  <button id="reset-btn" onclick="resetAll()">↺ Zurücksetzen</button>
</header>

<div class="table-wrap">
  <table id="main-table">
    <thead>
      <tr>
        <th class="name-col">Name</th>
        <th class="s1">Station 1</th>
        <th class="s2">Station 2</th>
        <th class="s3">Station 3</th>
        <th class="s4">Station 4</th>
        <th class="s5">Station 5</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div id="toast"></div>

<script>
const CHILDREN = [
  "Zlata","Jonas","Ferdinand","Lenox","Heinrich","Juna",
  "Linus","Bela","Paul","Timo","Donald","Felix",
  "Marlene","Jonathan","Karl","Magdalena","Sascha","Emma",
  "Matilda","Jayden","Luka","Malte","Jurek"
];

const STATION_COLORS = ['s1','s2','s3','s4','s5'];
const N_STATIONS = 5;

let state = {};
CHILDREN.forEach(n => state[n] = new Set());

function saveState() {
  const obj = {};
  CHILDREN.forEach(n => obj[n] = [...state[n]]);
  localStorage.setItem('lerntheke_state_v2', JSON.stringify(obj));
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('lerntheke_state_v2'));
    if (saved) CHILDREN.forEach(n => { if(saved[n]) state[n] = new Set(saved[n]); });
  } catch(e){}
}

function renderTable() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  CHILDREN.forEach(name => {
    const done = state[name];
    const allDone = done.size === N_STATIONS;

    const tr = document.createElement('tr');

    // Name cell
    const nameTd = document.createElement('td');
    nameTd.className = 'name-cell' + (allDone ? ' all-done' : '');
    nameTd.textContent = name;
    tr.appendChild(nameTd);

    // Station cells
    for (let i = 0; i < N_STATIONS; i++) {
      const td = document.createElement('td');
      const isDone = done.has(i);
      const colorClass = STATION_COLORS[i];

      const cell = document.createElement('div');
      cell.className = 'check-cell' + (isDone ? ' done-' + colorClass : '');
      cell.onclick = () => toggleStation(name, i);

      const icon = document.createElement('div');
      icon.className = 'check-icon';
      icon.textContent = isDone ? '✓' : (i + 1);

      cell.appendChild(icon);
      td.appendChild(cell);
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  });
}

function toggleStation(name, idx) {
  if (state[name].has(idx)) {
    state[name].delete(idx);
    showToast(name + ': Station ' + (idx+1) + ' entfernt');
  } else {
    state[name].add(idx);
    if (state[name].size === N_STATIONS) {
      showToast('🌟 ' + name + ' hat alle Stationen geschafft!');
    } else {
      showToast('✓ ' + name + ' – Station ' + (idx+1) + ' erledigt!');
    }
  }
  saveState();
  renderTable();
}

function resetAll() {
  if (!confirm('Wirklich alle Einträge zurücksetzen?')) return;
  CHILDREN.forEach(n => state[n] = new Set());
  saveState();
  renderTable();
  showToast('Alle Einträge wurden zurückgesetzt.');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadState();
renderTable();
</script>
</body>
</html>
