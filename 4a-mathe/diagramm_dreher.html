<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagramm-Dreher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a2e;
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 0;
}

h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  color: #fff;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 2px;
}
.subtitle {
  color: #aaa;
  font-size: 1rem;
  text-align: center;
  margin-bottom: 22px;
}

/* ── TOP BAR ── */
.top-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  justify-content: center;
}
.score-pill {
  background: rgba(255,255,255,0.08);
  border-radius: 40px;
  padding: 8px 18px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.score-pill .num { font-size: 1.5rem; }
.score-pill.correct .num { color: #2ecc71; }
.score-pill.wrong   .num { color: #ff6b35; }

.speed-group {
  display: flex;
  background: rgba(255,255,255,0.06);
  border-radius: 30px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}
.speed-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 0.9rem;
  padding: 8px 16px;
  border: none;
  background: transparent;
  color: #999;
  cursor: pointer;
  transition: all 0.2s;
}
.speed-btn.active { background: #ff6b35; color: white; }

/* ── CARDS ── */
.game-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 32px;
  width: 100%;
  max-width: 800px;
}

.card {
  flex: 1;
  max-width: 330px;
  min-height: 300px;
  border-radius: 28px;
  background: #0f1f3d;
  border: 3px solid rgba(255,255,255,0.1);
  box-shadow: 0 12px 48px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
  position: relative;
}
.card.match-glow {
  border-color: #2ecc71;
  box-shadow: 0 0 0 5px #2ecc7166, 0 12px 48px rgba(0,0,0,0.5);
  transform: scale(1.04);
}
.card.mismatch-glow {
  border-color: #e74c3c;
  box-shadow: 0 0 0 5px #e74c3c66, 0 12px 48px rgba(0,0,0,0.5);
}

.card-header {
  padding: 14px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  text-align: center;
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  color: #bbb;
  letter-spacing: 1px;
  flex-shrink: 0;
}

.card-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  position: relative;
}

/* The visible content inside card */
.card-content {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  /* flip animation */
  transition: opacity 0.15s ease;
}
.card-content.hidden { opacity: 0; }

.word-text {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.5rem, 3.5vw, 2.2rem);
  color: #fff;
  text-align: center;
  line-height: 1.25;
}

.card-content svg {
  width: 180px;
  height: 180px;
}



/* ── MIDDLE ── */
.middle {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.eq-sign {
  font-family: 'Fredoka One', cursive;
  font-size: 2.6rem;
  color: #444;
  transition: color 0.3s, transform 0.3s;
}
.eq-sign.match    { color: #2ecc71; transform: scale(1.5); }
.eq-sign.mismatch { color: #e74c3c; transform: scale(1.3); }

/* ── STOP BUTTON ── */
.stop-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  padding: 20px 100px;
  border-radius: 80px;
  border: none;
  background: linear-gradient(135deg, #ff4444, #ff6b35);
  color: white;
  cursor: pointer;
  box-shadow: 0 6px 32px rgba(255,80,50,0.5);
  transition: transform 0.1s, box-shadow 0.1s;
  letter-spacing: 2px;
}
.stop-btn:hover  { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,80,50,0.6); }
.stop-btn:active { transform: scale(0.95); }

/* ── OVERLAY ── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.overlay.show { display: flex; }

.result-card {
  background: #0f1f3d;
  border-radius: 32px;
  padding: 40px 48px;
  text-align: center;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  max-width: 500px;
  width: 92%;
  animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  border: 2px solid rgba(255,255,255,0.08);
}
@keyframes popIn {
  from { transform: scale(0.4) translateY(40px); opacity: 0; }
  to   { transform: scale(1)   translateY(0);    opacity: 1; }
}
.result-big   { font-size: 5rem; margin-bottom: 10px; }
.result-title { font-family: 'Fredoka One', cursive; font-size: 2.4rem; margin-bottom: 8px; }
.result-title.ok  { color: #2ecc71; }
.result-title.err { color: #ff6b35; }
.result-sub { color: #aaa; font-size: 1.05rem; margin-bottom: 24px; line-height: 1.5; }

.result-pair-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  padding: 16px 20px;
  margin-bottom: 28px;
}
.ritem { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ritem svg { width: 80px; height: 80px; }
.rlbl { font-family: 'Fredoka One', cursive; font-size: 0.9rem; color: #ddd; }
.rsym { font-size: 2.4rem; font-family: 'Fredoka One', cursive; }
.rsym.ok  { color: #2ecc71; }
.rsym.err { color: #e74c3c; }

.weiter-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 1.7rem;
  padding: 16px 50px;
  border-radius: 60px;
  border: none;
  background: linear-gradient(135deg, #4ecdc4, #2ecc71);
  color: white;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(78,205,196,0.4);
  transition: transform 0.1s;
}
.weiter-btn:hover { transform: translateY(-2px); }

/* ── STARS ── */
.stars-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 300; display: none; }
.stars-wrap.show { display: block; }
.star { position: absolute; animation: flyUp 1.4s ease-out forwards; }
@keyframes flyUp {
  0%   { opacity: 1; transform: translateY(0)     rotate(0deg)   scale(1);   }
  100% { opacity: 0; transform: translateY(-260px) rotate(200deg) scale(0.3); }
}
</style>
</head>
<body>

<h1>🎡 Diagramm-Dreher</h1>
<p class="subtitle">Wann passen Begriff und Bild zusammen? — Sag <strong style="color:#ff6b35">STOPP!</strong></p>

<div class="top-bar">
  <div class="score-pill correct">✓ Richtig <span class="num" id="sCorrect">0</span></div>
  <div class="score-pill wrong">✗ Falsch <span class="num" id="sWrong">0</span></div>
  <div class="speed-group">
    <button class="speed-btn"        onclick="setSpeed('slow',this)">🐢 Langsam</button>
    <button class="speed-btn active" onclick="setSpeed('normal',this)">🐇 Normal</button>
    <button class="speed-btn"        onclick="setSpeed('fast',this)">🚀 Schnell</button>
  </div>
</div>

<div class="game-wrap">

  <!-- WORD CARD -->
  <div class="card" id="cardWord">
    <div class="card-header">📝 Begriff</div>
    <div class="card-body">
      <div class="card-content" id="contentWord">
        <div class="word-text" id="wordText">–</div>
      </div>

    </div>
  </div>

  <!-- MIDDLE -->
  <div class="middle">
    <div class="eq-sign" id="eqSign">=?</div>
  </div>

  <!-- IMAGE CARD -->
  <div class="card" id="cardImg">
    <div class="card-header">🖼️ Diagramm</div>
    <div class="card-body">
      <div class="card-content" id="contentImg">
        <div id="imgSvg"></div>
      </div>

    </div>
  </div>

</div>

<button class="stop-btn" onclick="handleStop()">⛔ STOPP!</button>

<!-- Result overlay -->
<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-big"   id="rEmoji"></div>
    <div class="result-title" id="rTitle"></div>
    <div class="result-sub"   id="rSub"></div>
    <div class="result-pair-box" id="rPair"></div>
    <button class="weiter-btn" onclick="continueGame()">▶ Weiter!</button>
  </div>
</div>

<div class="stars-wrap" id="stars"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────
const DIAGRAMS = [
  {
    id: 'saeulen',
    word: 'Säulendiagramm',
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="3" width="3" height="90" fill="#8899bb" rx="1"/>
      <rect x="4" y="90" width="92" height="3" fill="#8899bb" rx="1"/>
      <rect x="14" y="42" width="14" height="48" fill="#ff6b35" rx="3"/>
      <rect x="34" y="24" width="14" height="66" fill="#4ecdc4" rx="3"/>
      <rect x="54" y="54" width="14" height="36" fill="#ffe66d" rx="3"/>
      <rect x="74" y="34" width="14" height="56" fill="#a8e6cf" rx="3"/>
    </svg>`
  },
  {
    id: 'balken',
    word: 'Balkendiagramm',
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="18" y="4"  width="3"  height="90" fill="#8899bb" rx="1"/>
      <rect x="18" y="91" width="78" height="3"  fill="#8899bb" rx="1"/>
      <rect x="21" y="12" width="62" height="14" fill="#ff6b35" rx="3"/>
      <rect x="21" y="33" width="42" height="14" fill="#4ecdc4" rx="3"/>
      <rect x="21" y="54" width="55" height="14" fill="#ffe66d" rx="3"/>
      <rect x="21" y="75" width="30" height="14" fill="#a8e6cf" rx="3"/>
    </svg>`
  },
  {
    id: 'kreis',
    word: 'Kreisdiagramm',
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="44" fill="#1a2a4a"/>
      <path d="M50,50 L50,6 A44,44 0 0,1 88,72 Z" fill="#ff6b35"/>
      <path d="M50,50 L88,72 A44,44 0 0,1 26,90 Z" fill="#4ecdc4"/>
      <path d="M50,50 L26,90 A44,44 0 0,1 10,30 Z" fill="#ffe66d"/>
      <path d="M50,50 L10,30 A44,44 0 0,1 50,6  Z" fill="#a8e6cf"/>
      <circle cx="50" cy="50" r="7" fill="#0f1f3d"/>
    </svg>`
  },
  {
    id: 'piktogramm',
    word: 'Piktogramm',
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

      <text x="10" y="26" font-size="13">⭐</text><text x="26" y="26" font-size="13">⭐</text><text x="42" y="26" font-size="13">⭐</text><text x="58" y="26" font-size="13">⭐</text>
      <text x="10" y="49" font-size="13">⭐</text><text x="26" y="49" font-size="13">⭐</text><text x="42" y="49" font-size="13">⭐</text>
      <text x="10" y="72" font-size="13">⭐</text><text x="26" y="72" font-size="13">⭐</text><text x="42" y="72" font-size="13">⭐</text><text x="58" y="72" font-size="13">⭐</text><text x="74" y="72" font-size="13">⭐</text>
      <text x="10" y="95" font-size="13">⭐</text><text x="26" y="95" font-size="13">⭐</text>
    </svg>`
  },
  {
    id: 'torten',
    word: 'Tortendiagramm',
    svg: `<svg viewBox="0 0 100 75" xmlns="http://www.w3.org/2000/svg">
      <path d="M50,44 L19.3,36.9 A38,12 0 0,1 50,32 L50,42 A38,12 0 0,0 19.3,46.9 Z" fill="#3d7a52"/>
      <path d="M50,44 L17.7,50.4 A38,12 0 0,1 19.3,36.9 L19.3,46.9 A38,12 0 0,0 17.7,60.4 Z" fill="#9a7e14"/>
      <path d="M79.1,51.7 A38,12 0 0,1 17.7,50.4 L17.7,60.4 A38,12 0 0,0 79.1,61.7 Z" fill="#1e7870"/>
      <path d="M50,32 A38,12 0 0,1 79.1,51.7 L79.1,61.7 A38,12 0 0,0 50,42 Z" fill="#b84a1a"/>
      <path d="M50,44 L50,32 A38,12 0 0,1 79.1,51.7 Z" fill="#ff6b35"/>
      <path d="M50,44 L79.1,51.7 A38,12 0 0,1 17.7,50.4 Z" fill="#4ecdc4"/>
      <path d="M50,44 L17.7,50.4 A38,12 0 0,1 19.3,36.9 Z" fill="#ffe66d"/>
      <path d="M50,44 L19.3,36.9 A38,12 0 0,1 50,32 Z" fill="#a8e6cf"/>
      <line x1="50" y1="44" x2="50"   y2="32"   stroke="#00000040" stroke-width="1"/>
      <line x1="50" y1="44" x2="79.1" y2="51.7" stroke="#00000040" stroke-width="1"/>
      <line x1="50" y1="44" x2="17.7" y2="50.4" stroke="#00000040" stroke-width="1"/>
      <line x1="50" y1="44" x2="19.3" y2="36.9" stroke="#00000040" stroke-width="1"/>
      <ellipse cx="50" cy="44" rx="38" ry="12" fill="none" stroke="#00000025" stroke-width="0.8"/>
    </svg>`
  }
];

// ── STATE ─────────────────────────────────────────────────────
let interval     = 3000; // ms per step
let wordIdx      = 0;
let imgIdx       = 0;
let wordTimer    = null;
let imgTimer     = null;
let stopped      = false;
let scoreOk      = 0;
let scoreErr     = 0;

// Separate shuffled sequences
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Flat sequence of diagram ids — both cards draw from this independently
// but we guarantee a match appears at least every MAX_BEFORE_MATCH steps.
const MAX_BEFORE_MATCH = 7;
let stepsSinceMatch = 0;

// Build an infinite stream: each call returns the next diagram to show.
// wordCursor and imgCursor track position in their own shuffled decks.
let wordDeck = shuffle(DIAGRAMS);
let imgDeck  = shuffle(DIAGRAMS);
let wordCursor = 0;
let imgCursor  = 0;

function nextWord() {
  if (wordCursor >= wordDeck.length) { wordDeck = shuffle(DIAGRAMS); wordCursor = 0; }
  return wordDeck[wordCursor++];
}
function nextImg() {
  if (imgCursor >= imgDeck.length) { imgDeck = shuffle(DIAGRAMS); imgCursor = 0; }
  return imgDeck[imgCursor++];
}

// Current displayed items
let currentWord = null;
let currentImg  = null;

function pickNext() {
  stepsSinceMatch++;
  // Force a match if we've gone too long without one
  if (stepsSinceMatch >= MAX_BEFORE_MATCH) {
    const pool = shuffle(DIAGRAMS);
    currentWord = pool[0];
    currentImg  = pool[0]; // same diagram = guaranteed match
    stepsSinceMatch = 0;
  } else {
    currentWord = nextWord();
    currentImg  = nextImg();
    // Small chance (~30%) of deliberate match for fun
    if (Math.random() < 0.20) {
      currentImg = currentWord;
    }
  }
}

// ── RENDER ────────────────────────────────────────────────────
function showWord(d) {
  const el = document.getElementById('contentWord');
  el.classList.add('hidden');
  setTimeout(() => {
    document.getElementById('wordText').textContent = d.word;
    el.classList.remove('hidden');
  }, 150);
}

function showImg(d) {
  const el = document.getElementById('contentImg');
  el.classList.add('hidden');
  setTimeout(() => {
    document.getElementById('imgSvg').innerHTML = d.svg;
    el.classList.remove('hidden');
  }, 150);
}

// ── CYCLING ───────────────────────────────────────────────────
function startCycling() {
  stopped = false;
  clearFeedback();

  // Pick and show first pair
  pickNext();
  showWord(currentWord);
  showImg(currentImg);

  // One timer — both cards switch at exactly the same moment
  wordTimer = setInterval(() => {
    pickNext();
    showWord(currentWord);
    showImg(currentImg);
  }, interval);
}

function stopCycling() {
  clearInterval(wordTimer);
}

function setSpeed(s, btn) {
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (s === 'slow')   interval = 5000;
  if (s === 'normal') interval = 3000;
  if (s === 'fast')   interval = 1500;
  if (!stopped) {
    stopCycling();
    startCycling();
  }
}

// ── STOP ──────────────────────────────────────────────────────
function handleStop() {
  if (stopped) return;
  stopped = true;
  stopCycling();

  const cw = currentWord;
  const ci = currentImg;
  const ok = cw.id === ci.id;

  const eq = document.getElementById('eqSign');
  const cWord = document.getElementById('cardWord');
  const cImg  = document.getElementById('cardImg');

  if (ok) {
    eq.textContent = '='; eq.className = 'eq-sign match';
    cWord.classList.add('match-glow');
    cImg.classList.add('match-glow');
    scoreOk++;
    document.getElementById('sCorrect').textContent = scoreOk;
    spawnStars();
  } else {
    eq.textContent = '≠'; eq.className = 'eq-sign mismatch';
    cWord.classList.add('mismatch-glow');
    cImg.classList.add('mismatch-glow');
    scoreErr++;
    document.getElementById('sWrong').textContent = scoreErr;
  }

  setTimeout(() => showResult(ok, cw, ci), ok ? 700 : 400);
}

function clearFeedback() {
  document.getElementById('eqSign').textContent = '=?';
  document.getElementById('eqSign').className   = 'eq-sign';
  document.getElementById('cardWord').className = 'card';
  document.getElementById('cardImg').className  = 'card';
}

// ── RESULT ────────────────────────────────────────────────────
function showResult(ok, cw, ci) {
  document.getElementById('rEmoji').textContent = ok ? '🎉' : '🙈';
  const t = document.getElementById('rTitle');
  t.textContent = ok ? 'Super! Richtig!' : 'Noch nicht!';
  t.className = 'result-title ' + (ok ? 'ok' : 'err');
  document.getElementById('rSub').textContent = ok
    ? `„${cw.word}" passt perfekt zu diesem Bild!`
    : `„${cw.word}" gehört nicht zu „${ci.word}".`;

  const dw = DIAGRAMS.find(d => d.id === cw.id);
  const di = DIAGRAMS.find(d => d.id === ci.id);
  document.getElementById('rPair').innerHTML = `
    <div class="ritem">${dw.svg}<div class="rlbl">${cw.word}</div></div>
    <div class="rsym ${ok?'ok':'err'}">${ok ? '✓' : '≠'}</div>
    <div class="ritem">${di.svg}<div class="rlbl">${ci.word}</div></div>
  `;
  document.getElementById('overlay').classList.add('show');
}

function continueGame() {
  document.getElementById('overlay').classList.remove('show');
  startCycling();
}

// ── STARS ─────────────────────────────────────────────────────
function spawnStars() {
  const c = document.getElementById('stars');
  c.classList.add('show');
  c.innerHTML = '';
  ['⭐','🌟','✨','🎊','🎉','💫'].forEach(em => {
    for (let k = 0; k < 4; k++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = (Math.random() * 95) + 'vw';
      s.style.top  = (30 + Math.random() * 60) + 'vh';
      s.style.fontSize = (1.4 + Math.random() * 2) + 'rem';
      s.style.animationDelay = (Math.random() * 0.8) + 's';
      s.textContent = em;
      c.appendChild(s);
    }
  });
  setTimeout(() => c.classList.remove('show'), 2200);
}

// ── KEYBOARD ──────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === 'Enter') {
    e.preventDefault();
    if (!stopped) handleStop();
    else if (document.getElementById('overlay').classList.contains('show')) continueGame();
  }
});

// ── INIT ──────────────────────────────────────────────────────
startCycling();
</script>
</body>
</html>
