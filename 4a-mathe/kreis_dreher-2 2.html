<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kreis-Dreher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a2e;
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image:
    radial-gradient(ellipse at 10% 10%, #4ecdc420 0%, transparent 50%),
    radial-gradient(ellipse at 90% 90%, #ff6b3520 0%, transparent 50%);
}

h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  color: #fff;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 2px;
}
.subtitle {
  color: #aaa;
  font-size: 1rem;
  text-align: center;
  margin-bottom: 22px;
}

.top-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  justify-content: center;
}
.score-pill {
  background: rgba(255,255,255,0.08);
  border-radius: 40px;
  padding: 8px 18px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.score-pill .num { font-size: 1.5rem; }
.score-pill.correct .num { color: #2ecc71; }
.score-pill.wrong   .num { color: #ff6b35; }

.speed-group {
  display: flex;
  background: rgba(255,255,255,0.06);
  border-radius: 30px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}
.speed-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 0.9rem;
  padding: 8px 16px;
  border: none;
  background: transparent;
  color: #999;
  cursor: pointer;
  transition: all 0.2s;
}
.speed-btn.active { background: #ff6b35; color: white; }

.game-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 32px;
  width: 100%;
  max-width: 800px;
}

.card {
  flex: 1;
  max-width: 330px;
  min-height: 300px;
  border-radius: 28px;
  background: #0f1f3d;
  border: 3px solid rgba(255,255,255,0.1);
  box-shadow: 0 12px 48px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
}
.card.match-glow {
  border-color: #2ecc71;
  box-shadow: 0 0 0 5px #2ecc7166, 0 12px 48px rgba(0,0,0,0.5);
  transform: scale(1.04);
}
.card.mismatch-glow {
  border-color: #e74c3c;
  box-shadow: 0 0 0 5px #e74c3c66, 0 12px 48px rgba(0,0,0,0.5);
}

.card-header {
  padding: 14px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  text-align: center;
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  color: #bbb;
  letter-spacing: 1px;
  flex-shrink: 0;
}

.card-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
}

.card-content {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  transition: opacity 0.15s ease;
}
.card-content.hidden { opacity: 0; }

.word-text {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.5rem, 3.5vw, 2.4rem);
  color: #fff;
  text-align: center;
  line-height: 1.25;
}

.card-content svg {
  width: 200px;
  height: 200px;
}

.middle {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.eq-sign {
  font-family: 'Fredoka One', cursive;
  font-size: 2.6rem;
  color: #444;
  transition: color 0.3s, transform 0.3s;
}
.eq-sign.match    { color: #2ecc71; transform: scale(1.5); }
.eq-sign.mismatch { color: #e74c3c; transform: scale(1.3); }

.stop-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  padding: 20px 100px;
  border-radius: 80px;
  border: none;
  background: linear-gradient(135deg, #ff4444, #ff6b35);
  color: white;
  cursor: pointer;
  box-shadow: 0 6px 32px rgba(255,80,50,0.5);
  transition: transform 0.1s, box-shadow 0.1s;
  letter-spacing: 2px;
}
.stop-btn:hover  { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,80,50,0.6); }
.stop-btn:active { transform: scale(0.95); }

.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.overlay.show { display: flex; }

.result-card {
  background: #0f1f3d;
  border-radius: 32px;
  padding: 40px 48px;
  text-align: center;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  max-width: 500px;
  width: 92%;
  animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  border: 2px solid rgba(255,255,255,0.08);
}
@keyframes popIn {
  from { transform: scale(0.4) translateY(40px); opacity: 0; }
  to   { transform: scale(1)   translateY(0);    opacity: 1; }
}
.result-big   { font-size: 5rem; margin-bottom: 10px; }
.result-title { font-family: 'Fredoka One', cursive; font-size: 2.4rem; margin-bottom: 8px; }
.result-title.ok  { color: #2ecc71; }
.result-title.err { color: #ff6b35; }
.result-sub { color: #aaa; font-size: 1.05rem; margin-bottom: 24px; line-height: 1.5; }



.weiter-btn {
  font-family: 'Fredoka One', cursive;
  font-size: 1.7rem;
  padding: 16px 50px;
  border-radius: 60px;
  border: none;
  background: linear-gradient(135deg, #4ecdc4, #2ecc71);
  color: white;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(78,205,196,0.4);
  transition: transform 0.1s;
}
.weiter-btn:hover { transform: translateY(-2px); }

.stars-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 300; display: none; }
.stars-wrap.show { display: block; }
.star { position: absolute; animation: flyUp 1.4s ease-out forwards; }
@keyframes flyUp {
  0%   { opacity: 1; transform: translateY(0)     rotate(0deg)   scale(1);   }
  100% { opacity: 0; transform: translateY(-260px) rotate(200deg) scale(0.3); }
}
</style>
</head>
<body>

<h1>⭕ Kreis-Dreher</h1>
<p class="subtitle">Wann passen Begriff und Bild zusammen? — Sag <strong style="color:#ff6b35">STOPP!</strong></p>

<div class="top-bar">
  <div class="score-pill correct">✓ Richtig <span class="num" id="sCorrect">0</span></div>
  <div class="score-pill wrong">✗ Falsch <span class="num" id="sWrong">0</span></div>
  <div class="speed-group">
    <button class="speed-btn"        onclick="setSpeed('slow',this)">🐢 Langsam</button>
    <button class="speed-btn active" onclick="setSpeed('normal',this)">🐇 Normal</button>
    <button class="speed-btn"        onclick="setSpeed('fast',this)">🚀 Schnell</button>
  </div>
</div>

<div class="game-wrap">
  <div class="card" id="cardWord">
    <div class="card-header">📝 Begriff</div>
    <div class="card-body">
      <div class="card-content" id="contentWord">
        <div class="word-text" id="wordText">–</div>
      </div>
    </div>
  </div>

  <div class="middle">
    <div class="eq-sign" id="eqSign">=?</div>
  </div>

  <div class="card" id="cardImg">
    <div class="card-header">🖼️ Bild</div>
    <div class="card-body">
      <div class="card-content" id="contentImg">
        <div id="imgSvg"></div>
      </div>
    </div>
  </div>
</div>

<button class="stop-btn" onclick="handleStop()">⛔ STOPP!</button>

<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-big"   id="rEmoji"></div>
    <div class="result-title" id="rTitle"></div>
    <div class="result-sub"   id="rSub"></div>
    <button class="weiter-btn" onclick="continueGame()">▶ Weiter!</button>
  </div>
</div>

<div class="stars-wrap" id="stars"></div>

<script>
// ── KREISE DATA ───────────────────────────────────────────────
// 3 RICHTIGE Karten (id passt zum Begriff) + 2 FALSCHE Bilder (andere id)

const ITEMS = [
  // ── RICHTIGE ──
  {
    id: 'radius',
    word: 'Radius',
    correct: true,
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" fill="#f5f0e8" stroke="#111" stroke-width="3.5"/>
      <!-- line drawn BEFORE the center dot so dot appears on top -->
      <!-- direction upper-left: angle ~205deg. inner edge at r=38 -->
      <!-- endpoint: 50+38*cos(205°)=50-34.4=15.6, 50+38*sin(205°)=50-16.1=33.9 -->
      <line x1="50" y1="50" x2="16" y2="34" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
      <text x="22" y="37" font-family="serif" font-style="italic" font-size="14" fill="#e74c3c" font-weight="bold">r</text>
      <circle cx="50" cy="50" r="2.5" fill="#111"/>
    </svg>`
  },
  {
    id: 'durchmesser',
    word: 'Durchmesser',
    correct: true,
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" fill="#f5f0e8" stroke="#111" stroke-width="3.5"/>
      <!-- line drawn BEFORE dot so dot is on top -->
      <line x1="17" y1="69" x2="83" y2="31" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
      <text x="54" y="29" font-family="serif" font-style="italic" font-size="13" fill="#3498db" font-weight="bold">d</text>
      <circle cx="50" cy="50" r="2.5" fill="#111"/>
    </svg>`
  },
  {
    id: 'mittelpunkt',
    word: 'Mittelpunkt',
    correct: true,
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" fill="#f5f0e8" stroke="#111" stroke-width="3.5"/>
      <circle cx="50" cy="50" r="4" fill="#111"/>
      <text x="56" y="48" font-family="serif" font-style="italic" font-size="14" fill="#111" font-weight="bold">M</text>
    </svg>`
  },

  // ── FALSCHE BILDER ──
  // Sehne (Durchmesser der NICHT durch Mittelpunkt geht — Sehne)
  {
    id: 'sehne',
    word: null,
    correct: false,
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" fill="#f5f0e8" stroke="#111" stroke-width="3.5"/>
      <circle cx="50" cy="50" r="2.5" fill="#111"/>
      <!-- Chord that clearly does NOT pass through center -->
      <line x1="18" y1="28" x2="55" y2="90" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`
  },
  // Falscher Mittelpunkt (Punkt deutlich abseits der Mitte, aber im Kreis)
  {
    id: 'falscher_mp',
    word: null,
    correct: false,
    svg: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="40" fill="#f5f0e8" stroke="#111" stroke-width="3.5"/>
      <!-- Point clearly off-center, but inside circle -->
      <circle cx="34" cy="38" r="4" fill="#111"/>
      <text x="40" y="36" font-family="serif" font-style="italic" font-size="14" fill="#111" font-weight="bold">M</text>
    </svg>`
  },
];

// Only the 3 correct items are valid word sources
const WORDS  = ITEMS.filter(i => i.correct);
// All 5 items are valid image sources
const IMAGES = ITEMS;

// ── STATE ─────────────────────────────────────────────────────
let interval = 3000;
const MAX_BEFORE_MATCH = 5;
let stepsSinceMatch = 0;

let wordDeck   = shuffle([...WORDS]);
let imgDeck    = shuffle([...IMAGES]);
let wordCursor = 0;
let imgCursor  = 0;

let currentWord = null;
let currentImg  = null;
let stopped  = false;
let wordTimer = null;
let scoreOk  = 0;
let scoreErr = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function nextFromDeck(deck, cursor, source) {
  if (cursor.val >= deck.val.length) { deck.val = shuffle(source); cursor.val = 0; }
  return deck.val[cursor.val++];
}

// Using objects as mutable refs
const wDeck = { val: shuffle([...WORDS])  };
const iDeck = { val: shuffle([...IMAGES]) };
const wCur  = { val: 0 };
const iCur  = { val: 0 };

function nextWord() {
  if (wCur.val >= wDeck.val.length) { wDeck.val = shuffle([...WORDS]);  wCur.val = 0; }
  return wDeck.val[wCur.val++];
}
function nextImg() {
  if (iCur.val >= iDeck.val.length) { iDeck.val = shuffle([...IMAGES]); iCur.val = 0; }
  return iDeck.val[iCur.val++];
}

function pickNext() {
  stepsSinceMatch++;
  if (stepsSinceMatch >= MAX_BEFORE_MATCH) {
    const pick = WORDS[Math.floor(Math.random() * WORDS.length)];
    currentWord = pick;
    currentImg  = pick;
    stepsSinceMatch = 0;
  } else {
    currentWord = nextWord();
    currentImg  = nextImg();
    if (Math.random() < 0.10) {
      currentImg = currentWord;
    }
  }

}

// ── RENDER ────────────────────────────────────────────────────
function showWord(d) {
  const el = document.getElementById('contentWord');
  el.classList.add('hidden');
  setTimeout(() => {
    document.getElementById('wordText').textContent = d.word;
    el.classList.remove('hidden');
  }, 150);
}

function showImg(d) {
  const el = document.getElementById('contentImg');
  el.classList.add('hidden');
  setTimeout(() => {
    document.getElementById('imgSvg').innerHTML = d.svg;
    el.classList.remove('hidden');
  }, 150);
}

// ── CYCLING ───────────────────────────────────────────────────
function startCycling() {
  stopped = false;
  clearFeedback();
  pickNext();
  showWord(currentWord);
  showImg(currentImg);
  wordTimer = setInterval(() => {
    pickNext();
    showWord(currentWord);
    showImg(currentImg);
  }, interval);
}

function stopCycling() { clearInterval(wordTimer); }

function setSpeed(s, btn) {
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (s === 'slow')   interval = 5000;
  if (s === 'normal') interval = 3000;
  if (s === 'fast')   interval = 1500;
  if (!stopped) { stopCycling(); startCycling(); }
}

// ── STOP ──────────────────────────────────────────────────────
function handleStop() {
  if (stopped) return;
  stopped = true;
  stopCycling();

  const ok = currentWord.id === currentImg.id;

  const eq = document.getElementById('eqSign');
  const cW = document.getElementById('cardWord');
  const cI = document.getElementById('cardImg');

  if (ok) {
    eq.textContent = '='; eq.className = 'eq-sign match';
    cW.classList.add('match-glow');
    cI.classList.add('match-glow');
    scoreOk++;
    document.getElementById('sCorrect').textContent = scoreOk;
    spawnStars();
  } else {
    eq.textContent = '≠'; eq.className = 'eq-sign mismatch';
    cW.classList.add('mismatch-glow');
    cI.classList.add('mismatch-glow');
    scoreErr++;
    document.getElementById('sWrong').textContent = scoreErr;
  }

  if (ok) {
    // Richtig: kein Overlay — nach kurzer Pause automatisch weiter
    setTimeout(() => continueGame(), 1800);
  } else {
    setTimeout(() => showResult(), 400);
  }
}

function clearFeedback() {
  document.getElementById('eqSign').textContent = '=?';
  document.getElementById('eqSign').className   = 'eq-sign';
  document.getElementById('cardWord').className = 'card';
  document.getElementById('cardImg').className  = 'card';

}

// ── RESULT ────────────────────────────────────────────────────
function showResult() {
  document.getElementById('rEmoji').textContent = '🙈';
  const t = document.getElementById('rTitle');
  t.textContent = 'Noch nicht!';
  t.className = 'result-title err';

  const imgItem = currentImg;
  let hint = '';
  if (imgItem.id === 'sehne') {
    hint = 'Diese Linie geht nicht durch den Mittelpunkt — das ist eine Sehne, kein Durchmesser!';
  } else if (imgItem.id === 'falscher_mp') {
    hint = 'Dieser Punkt liegt nicht in der Mitte — das ist nicht der Mittelpunkt!';
  } else {
    hint = `Das Bild zeigt nicht „${currentWord.word}".`;
  }
  document.getElementById('rSub').textContent = hint;

  document.getElementById('overlay').classList.add('show');
}

function continueGame() {
  document.getElementById('overlay').classList.remove('show');
  startCycling();
}

// ── STARS ─────────────────────────────────────────────────────
function spawnStars() {
  const c = document.getElementById('stars');
  c.classList.add('show');
  c.innerHTML = '';
  ['⭐','🌟','✨','🎊','🎉','💫'].forEach(em => {
    for (let k = 0; k < 4; k++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = (Math.random() * 95) + 'vw';
      s.style.top  = (30 + Math.random() * 60) + 'vh';
      s.style.fontSize = (1.4 + Math.random() * 2) + 'rem';
      s.style.animationDelay = (Math.random() * 0.8) + 's';
      s.textContent = em;
      c.appendChild(s);
    }
  });
  setTimeout(() => c.classList.remove('show'), 2200);
}

// ── KEYBOARD ──────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === 'Enter') {
    e.preventDefault();
    if (!stopped) handleStop();
    else if (document.getElementById('overlay').classList.contains('show')) continueGame();
  }
});

// ── INIT ──────────────────────────────────────────────────────
startCycling();
</script>
</body>
</html>
