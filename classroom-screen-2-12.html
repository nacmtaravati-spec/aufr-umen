<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassScreen – Boehlitz-Ehrenberg</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Baloo+2:wght@700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#f0f4ff;min-height:100vh;overflow:hidden;}

/* ── TOOLBAR ── */
#toolbar {
  position:fixed;top:0;left:0;right:0;
  background:linear-gradient(135deg,#4f7ef8 0%,#7c3aed 100%);
  box-shadow:0 4px 20px rgba(79,126,248,.4);
  z-index:1000;
  padding:10px 12px 0;
}
#tb-top {
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.logo {
  font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:800;
  color:#fff;white-space:nowrap;flex-shrink:0;
  text-shadow:0 2px 8px rgba(0,0,0,.2);
}
.logo span{opacity:.7;font-size:13px;font-weight:700;margin-left:4px;}

/* BG DOTS */
.bgwrap{display:flex;align-items:center;gap:5px;margin-left:auto;}
.bgwrap small{font-size:10px;color:rgba(255,255,255,.7);font-weight:700;}
.bgdot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;flex-shrink:0;}
.bgdot.on{border-color:#fff;transform:scale(1.15);}

/* WIDGET TABS */
#tb-tabs {
  display:flex;gap:6px;overflow-x:auto;padding-bottom:0;
}
#tb-tabs::-webkit-scrollbar{display:none;}
.tab {
  display:flex;align-items:center;gap:5px;
  padding:8px 14px;border-radius:12px 12px 0 0;
  border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;
  white-space:nowrap;flex-shrink:0;
  transition:all .2s;
  background:rgba(255,255,255,.18);
  color:rgba(255,255,255,.85);
  border:1.5px solid rgba(255,255,255,.2);
  border-bottom:none;
  position:relative;
}
.tab:hover{background:rgba(255,255,255,.28);color:#fff;}
.tab.on{
  background:#fff;color:#4f7ef8;
  box-shadow:0 -4px 12px rgba(79,126,248,.2);
}
.tab .tab-ic{font-size:15px;}
.tab .tab-close{
  width:16px;height:16px;border-radius:50%;border:none;background:rgba(0,0,0,.1);
  color:inherit;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;padding:0;line-height:1;
}
.tab .tab-close:hover{background:#ef4444;color:#fff;}
.tab.on .tab-close{background:rgba(79,126,248,.15);}

/* ADD BUTTONS */
#tb-add {
  display:flex;gap:4px;overflow-x:auto;padding:8px 12px 10px;
  border-top:1px solid rgba(255,255,255,.15);margin-top:8px;
}
#tb-add::-webkit-scrollbar{display:none;}
.add-btn {
  display:flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:20px;border:1.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);
  cursor:pointer;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;
  white-space:nowrap;flex-shrink:0;transition:all .15s;
}
.add-btn:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.5);}
.add-btn .ai{font-size:13px;}

/* ── BOARD ── */
#board {
  position:fixed;
  left:0;right:0;bottom:0;
  background:#f0f4ff;
  overflow:hidden;
}

/* ── PANEL ── */
.panel {
  position:absolute;
  background:#fff;
  border:1.5px solid #dde3ff;
  border-radius:16px;
  box-shadow:0 6px 24px rgba(79,126,248,.12);
  display:flex;flex-direction:column;
  overflow:hidden;
  min-width:300px;min-height:160px;
}
.panel-head {
  display:flex;align-items:center;gap:7px;
  padding:9px 12px;
  background:linear-gradient(135deg,#f8f9ff,#eef2ff);
  border-bottom:1.5px solid #dde3ff;
  flex-shrink:0;cursor:grab;
}
.panel-head:active{cursor:grabbing;}
.panel-ic{font-size:14px;}
.panel-title{font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#7c89b0;flex:1;}
.panel-body{flex:1;padding:14px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rzh{position:absolute;bottom:0;right:0;width:20px;height:20px;cursor:se-resize;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;}
.rzh::after{content:'';width:8px;height:8px;border-right:2px solid #c0c8e8;border-bottom:2px solid #c0c8e8;border-radius:1px;}

/* ── BUTTONS ── */
.btn{padding:8px 14px;border-radius:10px;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .15s;}
.btn:hover{filter:brightness(1.08);}
.bg{background:#dcfce7;color:#15803d;} .by{background:#fef3c7;color:#b45309;}
.bm{background:#f1f5f9;color:#64748b;border:1.5px solid #dde3ff;}
.ba{background:linear-gradient(135deg,#4f7ef8,#7c3aed);color:#fff;}
.br{background:#fee2e2;color:#dc2626;}
.btn-row{display:flex;gap:6px;width:100%;margin-top:8px;}
.btn-row .btn{flex:1;}

/* ── NOISE ── */
/* shake removed */

/* ── TRAFFIC LIGHT ── */
.tlbox{background:#111;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:10px;border:3px solid #2a2a2a;}
.tlb{width:56px;height:56px;border-radius:50%;cursor:pointer;transition:all .35s;border:3px solid rgba(255,255,255,.06);}

/* ── TIMER ── */
.clkbig{font-family:'Baloo 2',sans-serif;font-size:44px;font-weight:800;color:#4f7ef8;text-align:center;letter-spacing:1px;}
.timer-inputs{display:flex;gap:6px;align-items:center;margin:8px 0;}
.timer-inputs input{width:50px;text-align:center;padding:5px;border-radius:8px;border:1.5px solid #dde3ff;background:#f8f9ff;color:#1e2a4a;font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:800;outline:none;}

/* ── TEXT ── */
.txt-tb{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1.5px solid #dde3ff;background:#f8f9ff;flex-wrap:wrap;flex-shrink:0;}
.txt-tb button{padding:3px 7px;border-radius:6px;border:1.5px solid #dde3ff;background:#fff;cursor:pointer;font-size:12px;font-weight:800;color:#1e2a4a;transition:all .15s;font-family:'Nunito',sans-serif;}
.txt-tb button:hover{background:#4f7ef8;color:#fff;border-color:#4f7ef8;}

/* ── SYMBOLS ── */
.sym-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;}
.sym-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;border:2px solid #dde3ff;cursor:pointer;background:#f8f9ff;color:#8892b0;font-family:'Nunito',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;transition:all .2s;}
.sym-btn .si{font-size:32px;}
.sym-btn.on{border-color:#4f7ef8;background:rgba(79,126,248,.1);color:#4f7ef8;}

/* ── MODAL ── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5000;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
#modal.open{display:flex;}
#mbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.25);}
.mtitle{font-size:17px;font-weight:900;color:#1e2a4a;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.mcl{background:none;border:none;font-size:18px;cursor:pointer;color:#8892b0;}
.mcl:hover{color:#ef4444;}
.msec{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#8892b0;margin:14px 0 6px;padding-bottom:5px;border-bottom:1.5px solid #eef2ff;}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mrow label{font-size:12px;font-weight:800;color:#1e2a4a;min-width:100px;}
.minp{flex:1;padding:7px 10px;border-radius:9px;border:1.5px solid #dde3ff;background:#f8f9ff;color:#1e2a4a;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;outline:none;}
.minp:focus{border-color:#4f7ef8;}
.note{font-size:11px;color:#8892b0;padding:8px 12px;background:#f8f9ff;border-radius:8px;border-left:3px solid #4f7ef8;line-height:1.5;margin-bottom:6px;}

/* MISC */
input[type=range]{accent-color:#4f7ef8;width:100%;}
input[type=number]{background:#f8f9ff;color:#1e2a4a;border:1.5px solid #dde3ff;border-radius:8px;padding:4px 6px;font-family:'Nunito',sans-serif;outline:none;}
textarea{resize:none;outline:none;font-family:'Nunito',sans-serif;}

/* TOAST */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(70px);background:#1e2a4a;color:#fff;padding:10px 22px;border-radius:30px;font-weight:800;font-size:13px;z-index:9000;transition:transform .3s;pointer-events:none;}
#toast.on{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <div id="tb-top">
    <div class="logo">📺 ClassScreen <span>Boehlitz-Ehrenberg</span></div>
    <div class="bgwrap">
      <small>BG:</small>
      <div class="bgdot on"  style="background:#f0f4ff" onclick="setBg(this,'#f0f4ff')" title="Hell-Blau"></div>
      <div class="bgdot"     style="background:#fffbeb" onclick="setBg(this,'#fffbeb')" title="Warm"></div>
      <div class="bgdot"     style="background:#f0fdf4" onclick="setBg(this,'#f0fdf4')" title="Grün"></div>
      <div class="bgdot"     style="background:#fdf4ff" onclick="setBg(this,'#fdf4ff')" title="Lila"></div>
      <div class="bgdot"     style="background:#1a1f2e;border-color:rgba(255,255,255,.3)" onclick="setBg(this,'#1a1f2e')" title="Dunkel"></div>
    </div>
  </div>

  <!-- TABS (offene Panels) -->
  <div id="tb-tabs"></div>

  <!-- ADD BUTTONS -->
  <div id="tb-add">
    <small style="font-size:10px;color:rgba(255,255,255,.6);font-weight:700;white-space:nowrap;align-self:center;">+ Hinzufügen:</small>
    <button class="add-btn" onclick="openPanel('noise')">   <span class="ai">🎤</span>Lautstärke</button>
    <button class="add-btn" onclick="openPanel('traffic')"> <span class="ai">🚦</span>Ampel</button>
    <button class="add-btn" onclick="openPanel('timer')">   <span class="ai">⏱️</span>Timer</button>
    <button class="add-btn" onclick="openPanel('clock')">   <span class="ai">🕐</span>Uhr</button>
    <button class="add-btn" onclick="openPanel('names')">   <span class="ai">👤</span>Namen</button>
    <button class="add-btn" onclick="openPanel('symbols')"> <span class="ai">🤫</span>Symbole</button>
    <button class="add-btn" onclick="openPanel('text')">    <span class="ai">📝</span>Text</button>
    <button class="add-btn" onclick="openPanel('stopwatch')"><span class="ai">⏱</span>Stoppuhr</button>
    <button class="add-btn" onclick="openPanel('dice')">    <span class="ai">🎲</span>Würfel</button>
  </div>
</div>

<div id="board"></div>

<!-- MODAL (Ampel) -->
<div id="modal" onclick="if(event.target===this)closeModal()">
  <div id="mbox">
    <div class="mtitle"><span>⚙️ Ampel-Einstellungen</span><button class="mcl" onclick="closeModal()">✕</button></div>
    <div class="msec">📋 Phasenname (nur für dich)</div>
    <div class="mrow"><label>Phase:</label><input class="minp" id="m-phase" value="Arbeitsphase"></div>
    <div class="note">💡 Die Hinweise siehst nur <strong>du</strong> – Kinder sehen nur die Ampelfarbe!</div>
    <div class="msec">🟢 Grün – Arbeiten</div>
    <div class="mrow"><label>Dein Hinweis:</label><input class="minp" id="m-lG" value="Kinder arbeiten!"></div>
    <div class="mrow"><label>Dauer:</label><input class="minp" id="m-tG" type="number" min="0" max="60" value="5" style="max-width:70px;"> <span style="font-size:12px;color:#8892b0;">Min.</span></div>
    <div class="msec">🟡 Gelb – Zu Ende kommen</div>
    <div class="mrow"><label>Dein Hinweis:</label><input class="minp" id="m-lY" value="Langsam fertig werden"></div>
    <div class="mrow"><label>Dauer:</label><input class="minp" id="m-tY" type="number" min="0" max="30" value="2" style="max-width:70px;"> <span style="font-size:12px;color:#8892b0;">Min.</span></div>
    <div class="msec">🔴 Rot – Stopp</div>
    <div class="mrow"><label>Dein Hinweis:</label><input class="minp" id="m-lR" value="Stifte weg – Ruhe!"></div>
    <div class="note">Rot bleibt bis du ⏹ Stopp drückst.</div>
    <div style="display:flex;gap:10px;margin-top:18px;">
      <button class="btn ba" style="flex:1;padding:12px;" onclick="tlSaveStart()">▶ Starten!</button>
      <button class="btn bm" style="flex:1;padding:12px;" onclick="closeModal()">Abbrechen</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════
// TOOLBAR HEIGHT (computed after render)
// ═══════════════════════════════════════
let TB_H = 0;
function updateBoard() {
  TB_H = document.getElementById('toolbar').offsetHeight;
  const board = document.getElementById('board');
  board.style.top = TB_H + 'px';
}

// ═══════════════════════════════════════
// DRAG & RESIZE
// ═══════════════════════════════════════
let drag=null, rsz=null;
document.addEventListener('mousemove', e => {
  if (drag) {
    const el = document.getElementById(drag.id);
    if (!el) return;
    let nx = e.clientX - drag.ox, ny = e.clientY - drag.oy;
    nx = Math.max(0, Math.min(nx, innerWidth - el.offsetWidth));
    ny = Math.max(0, Math.min(ny, innerHeight - TB_H - el.offsetHeight));
    el.style.left = nx+'px'; el.style.top = ny+'px';
  }
  if (rsz) {
    const el = document.getElementById(rsz.id);
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.width  = Math.max(220, e.clientX - r.left)+'px';
    el.style.height = Math.max(160, e.clientY - r.top)+'px';
  }
});
document.addEventListener('mouseup', () => { drag=null; rsz=null; });
function startDrag(e, id) {
  if (e.target.closest('.tab-close,.btn,.add-btn,.mcl,.minp,.tlb,input,textarea,button')) return;
  e.preventDefault();
  const r = document.getElementById(id).getBoundingClientRect();
  drag = {id, ox: e.clientX-r.left, oy: e.clientY-r.top};
  bringToFront(id);
}
function startRsz(e, id) { e.preventDefault(); e.stopPropagation(); rsz={id}; }

// ═══════════════════════════════════════
// PANEL SYSTEM
// ═══════════════════════════════════════
let pCount=0, zTop=10;
const panels = {}; // id -> {type, state}

const PCFG = {
  noise:    {t:'Lautstärke',    ic:'🎤', w:300, h:360},
  traffic:  {t:'Ampel',         ic:'🚦', w:220, h:360},
  timer:    {t:'Timer',         ic:'⏱️', w:240, h:290},
  clock:    {t:'Uhr',           ic:'🕐', w:240, h:140},
  names:    {t:'Zufallsname',   ic:'👤', w:250, h:270},
  symbols:  {t:'Symbole',       ic:'🤫', w:290, h:280},
  text:     {t:'Text',          ic:'📝', w:320, h:240},
  stopwatch:{t:'Stoppuhr',      ic:'⏱',  w:220, h:160},
  dice:     {t:'Würfel',        ic:'🎲', w:210, h:210},
};

function openPanel(type) {
  pCount++;
  const id = 'p'+pCount;
  const cfg = PCFG[type];
  const boardH = innerHeight - TB_H;
  const x = Math.min(20 + (pCount%6)*30, innerWidth-cfg.w-20);
  const y = Math.min(20 + (pCount%4)*20, boardH-cfg.h-20);

  const el = document.createElement('div');
  el.className='panel'; el.id=id; el.dataset.type=type;
  el.style.cssText=`left:${x}px;top:${y}px;width:${cfg.w}px;height:${cfg.h}px;z-index:${++zTop};`;

  if (type==='text') {
    el.innerHTML = `
      <div class="panel-head" onmousedown="startDrag(event,'${id}')">
        <span class="panel-ic">${cfg.ic}</span>
        <span class="panel-title">${cfg.t}</span>
      </div>
      ${buildTxtTb(id)}
      <textarea id="${id}-ta" style="flex:1;width:100%;padding:12px;border:none;color:#1e2a4a;font-size:18px;font-weight:600;line-height:1.6;background:transparent;min-height:60px;" placeholder="Aufgabe, Hausaufgaben, Info..."></textarea>
      <div class="rzh" onmousedown="startRsz(event,'${id}')"></div>`;
  } else {
    el.innerHTML = `
      <div class="panel-head" onmousedown="startDrag(event,'${id}')">
        <span class="panel-ic">${cfg.ic}</span>
        <span class="panel-title">${cfg.t}</span>
      </div>
      <div class="panel-body" id="${id}-b">${buildBody(type,id)}</div>
      <div class="rzh" onmousedown="startRsz(event,'${id}')"></div>`;
  }

  document.getElementById('board').appendChild(el);
  panels[id] = {type, state:{}};
  initPanel(type, id);
  addTab(id, cfg.ic, cfg.t);
  bringToFront(id);
  toast(cfg.ic+' '+cfg.t+' geöffnet');
}

function closePanel(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const s = panels[id]?.state;
  if (s) {
    if (s.interval) clearInterval(s.interval);
    if (s.tlInterval) clearInterval(s.tlInterval);
    if (s.animId) cancelAnimationFrame(s.animId);
    if (s.stream) s.stream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});
    if (s.actx) {try{s.actx.close();}catch(e){}}
  }
  delete panels[id];
  el.remove();
  removeTab(id);
}

function bringToFront(id) {
  document.getElementById(id).style.zIndex = ++zTop;
  // highlight tab
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.pid===id));
}

// ═══════════════════════════════════════
// TABS
// ═══════════════════════════════════════
function addTab(id, ic, title) {
  const tabs = document.getElementById('tb-tabs');
  const tab = document.createElement('button');
  tab.className='tab on';
  tab.dataset.pid=id;
  tab.innerHTML=`<span class="tab-ic">${ic}</span>${title}<button class="tab-close" onclick="event.stopPropagation();closePanel('${id}')">✕</button>`;
  tab.addEventListener('click', () => {
    bringToFront(id);
    // scroll panel into view if needed
    const el = document.getElementById(id);
    if (el) { el.style.zIndex=++zTop; }
  });
  // deactivate others
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  tabs.appendChild(tab);
  tabs.scrollLeft = tabs.scrollWidth;
  updateBoard();
}
function removeTab(id) {
  document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.pid===id)t.remove();});
  updateBoard();
}

// ═══════════════════════════════════════
// BODY BUILDERS
// ═══════════════════════════════════════
function buildBody(type, id) {
  if (type==='noise') return `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:100%;height:100%;padding:10px 8px;">

      <!-- GROSSES GESICHT -->
      <div id="${id}-face" style="font-size:90px;line-height:1;text-align:center;transition:all .4s ease;">😊</div>
      <div id="${id}-lbl" style="font-size:15px;font-weight:900;text-align:center;color:#15803d;min-height:22px;transition:color .4s;">Super ruhig!</div>

      <!-- VERTIKALER SCHIEBEREGLER -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;margin:10px 0;">
        <span style="font-size:11px;font-weight:800;color:#ef4444;">😡 Sehr laut</span>
        <div style="position:relative;width:100%;height:48px;display:flex;align-items:center;">
          <!-- Farbiger Hintergrund der Skala -->
          <div style="position:absolute;left:0;right:0;height:20px;border-radius:10px;background:linear-gradient(to right,#22c55e 0%,#86efac 20%,#fde68a 45%,#fb923c 70%,#ef4444 100%);box-shadow:0 2px 8px rgba(0,0,0,.15);"></div>
          <input type="range" id="${id}-slider"
            min="0" max="100" value="0"
            style="position:relative;width:100%;height:20px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;z-index:1;"
            oninput="noiseSliderUpdate('${id}',this.value)">
        </div>
        <span style="font-size:11px;font-weight:800;color:#15803d;">😊 Sehr ruhig</span>
      </div>

      <!-- STUFEN ANZEIGE -->
      <div style="display:flex;justify-content:space-between;width:100%;padding:0 2px;">
        <div onclick="noiseSliderSet('${id}',0)"  style="cursor:pointer;font-size:18px;opacity:.5;transition:all .2s;" title="Ruhig">😊</div>
        <div onclick="noiseSliderSet('${id}',25)" style="cursor:pointer;font-size:18px;opacity:.5;transition:all .2s;" title="Ok">🙂</div>
        <div onclick="noiseSliderSet('${id}',50)" style="cursor:pointer;font-size:18px;opacity:.5;transition:all .2s;" title="Etwas laut">😐</div>
        <div onclick="noiseSliderSet('${id}',75)" style="cursor:pointer;font-size:18px;opacity:.5;transition:all .2s;" title="Laut">😟</div>

function timerToggle(id){

function timerReset(id){const s=panels[id]?.state,btn=document.getElementById(`${id}-tb2`);if(!s)return;clearInterval(s.interval);s.running=false;s.rem=0;if(btn){btn.textContent='▶ Start';btn.className='btn bg';}const d=document.getElementById(`${id}-d`);if(d){d.textContent='00:00';d.style.color='#1e2a4a';}const rg=document.getElementById(`${id}-rg`);if(rg){rg.style.strokeDashoffset='0';rg.style.stroke='#4f7ef8';}}
function timerDraw(id){const s=panels[id]?.state,d=document.getElementById(`${id}-d`),rg=document.getElementById(`${id}-rg`);if(!s||!d)return;const m=Math.floor(s.rem/60),sec=s.rem%60;d.textContent=p2(m)+':'+p2(sec);const pct=s.total>0?s.rem/s.total:1;if(rg){rg.style.strokeDashoffset=327*(1-pct);rg.style.stroke=pct>0.5?'#4f7ef8':pct>0.2?'#f59e0b':'#ef4444';}d.style.color=s.rem<=10?'#ef4444':s.rem<=30?'#b45309':'#1e2a4a';}
function playAlarm(){
  try{
    // Jubel-Melodie mit gemeinsamem AudioContext
    const notes=[
      {f:523,t:0,    dur:.15},
      {f:659,t:.16,  dur:.15},
      {f:784,t:.32,  dur:.15},
      {f:1047,t:.48, dur:.3},
      {f:784,t:.8,   dur:.12},
      {f:1047,t:.93, dur:.5},
    ];
    notes.forEach(n=>playTone(n.f, n.t, n.dur, 0.45, 'sine'));
    // Perkussion
    const ctx=getAudioCtx();
    [0,.16,.32,.48].forEach(t=>{
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.08,ctx.sampleRate);
      const data=buf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.03));
      const src=ctx.createBufferSource(),g=ctx.createGain();
      src.buffer=buf;src.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.07);
      src.start(ctx.currentTime+t);
    });
  }catch(e){ console.log('alarm error:',e); }
}

function symSet(id,idx){
  for(let i=0;i<6;i++){const b=document.getElementById(`${id}-sy${i}`);if(!b)continue;b.classList.toggle('on',i===idx);}
  if(idx===0||idx===1) playShush(); // 🤫🤐 Shhh-Geräusch
  if(idx===5) playClap();           // 👏 Klatschen

function playShush(){
  try{
    const ctx=getAudioCtx();
    // Weißes Rauschen gefiltert = "Shhh" Geräusch, 3x kurz
    [0, 0.4, 0.8].forEach(offset=>{
      const dur=0.3;
      const buf=ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
      const data=buf.getChannelData(0);
      for(let i=0;i<data.length;i++){
        // Hüllkurve: schnell an, langsam ab = "Sh"
        const env=Math.exp(-i/(ctx.sampleRate*0.12));
        data[i]=(Math.random()*2-1)*env*0.8;
      }
      const src=ctx.createBufferSource();
      const filter=ctx.createBiquadFilter();
      filter.type='bandpass'; filter.frequency.value=3500; filter.Q.value=1.5;
      const gain=ctx.createGain();
      src.buffer=buf; src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(1.2, ctx.currentTime+offset);
      src.start(ctx.currentTime+offset);
      src.stop(ctx.currentTime+offset+dur);
    });
  }catch(e){ console.log('shush error:',e); }
}
function playClap(){
  try{
    const ctx=getAudioCtx();
    // 3 echte Klatscher
    [0, 0.32, 0.64].forEach(offset=>{
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.12,ctx.sampleRate);
      const data=buf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.035));
      const src=ctx.createBufferSource();
      const filter=ctx.createBiquadFilter();
      filter.type='bandpass'; filter.frequency.value=1400; filter.Q.value=0.7;
      const gain=ctx.createGain();
      src.buffer=buf; src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(2.0, ctx.currentTime+offset);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+offset+0.1);
      src.start(ctx.currentTime+offset);
    });
  }catch(e){ console.log('clap error:',e); }
}

// ═══════════════════════════════════════
// AMPEL-GERÄUSCHE
// ═══════════════════════════════════════
// ═══════════════════════════════════════
// AUDIO ENGINE – einmaliger AudioContext
// ═══════════════════════════════════════
let _actx = null;
function getAudioCtx() {
  if (!_actx) {
    const C = window.AudioContext || window.webkitAudioContext;
    _actx = new C();
  }
  if (_actx.state === 'suspended') _actx.resume();
  return _actx;
}
// Audio beim ersten Klick irgendwo entsperren
document.addEventListener('click', () => { try { getAudioCtx(); } catch(e){} }, { once: false });

function playTone(freq, startTime, dur, vol, type='sine') {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.value = freq;
  const t = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t); osc.stop(t + dur + 0.05);
}

function playYellowSound() {
  try {
    // Drei helle Glocken: Ding! Ding! Ding!
    playTone(880, 0.0,  0.3, 0.5, 'sine');
    playTone(880, 0.35, 0.3, 0.5, 'sine');
    playTone(880, 0.70, 0.4, 0.5, 'sine');
  } catch(e) { console.log('yellow sound error:', e); }
}

function playRedSound() {
  try {
    // Alarm: tief-hoch wechselnd, sehr auffällig
    playTone(220, 0.0,  0.2, 0.5, 'sawtooth');
    playTone(440, 0.22, 0.2, 0.5, 'sawtooth');
    playTone(220, 0.44, 0.2, 0.5, 'sawtooth');
    playTone(440, 0.66, 0.2, 0.5, 'sawtooth');
    playTone(165, 0.88, 0.5, 0.6, 'sawtooth');
  } catch(e) { console.log('red sound error:', e); }
}

window.addEventListener('load',()=>{
  updateBoard();
  // Standard-Widgets öffnen
  setTimeout(()=>{
    openPanel('traffic');
    openPanel('timer');
    openPanel('noise');
    openPanel('clock');
    // Positionen anpassen
    const ids=Object.keys(panels);
    const W=innerWidth, H=innerHeight-TB_H;
    const positions=[
      {l:10,     t:10},
      {l:220,    t:10},
      {l:Math.min(460, W-360), t:10},
      {l:Math.max(0,  W-260), t:10}
    ];
    ids.forEach((id,i)=>{
      const el=document.getElementById(id);
      if(!el||!positions[i])return;
      el.style.left=Math.max(0,Math.min(positions[i].l, W-el.offsetWidth))+'px';
      el.style.top=Math.max(0,Math.min(positions[i].t, H-el.offsetHeight))+'px';
    });
  },200);
});
